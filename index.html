<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAKAFUL SURVIVAL</title>
<style>
:root{--navy:#0a1733;--navy2:#132349;--red:#d4142f;--gold:#d4af6a;--char:#2b2f38;--w:#fff;--mut:#9aa7c4;--ok:#2fbf8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:radial-gradient(120% 80% at 50% 0,#1a2f63,var(--navy) 60%);background-color:var(--navy);color:var(--w);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
#app{max-width:480px;margin:auto;padding:12px 14px 60px}
header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ib{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:12px;width:38px;height:38px;font-size:16px;cursor:pointer}
#prog{flex:1;height:5px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .6s}
.logo{width:38px;height:38px;border:1.5px dashed var(--gold);border-radius:50%;font-size:8px;display:grid;place-items:center;color:var(--gold);text-align:center;line-height:1}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px);border-radius:20px;padding:16px;margin-bottom:12px}
h1{font-size:34px;letter-spacing:2px;font-weight:900;line-height:1}
h1 b{color:var(--red)}h2{font-size:22px;margin-bottom:6px}h3{font-size:14px;color:var(--gold);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
p,.s{color:var(--mut);font-size:14px;line-height:1.5}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:16px;background:linear-gradient(135deg,var(--red),#8f0d20);color:#fff;font-weight:800;font-size:16px;letter-spacing:.5px;cursor:pointer;margin-top:10px;transition:transform .12s,box-shadow .2s;box-shadow:0 8px 22px rgba(212,20,47,.35)}
.btn:active{transform:scale(.95)}.btn.g{background:rgba(255,255,255,.1);box-shadow:none;border:1px solid rgba(255,255,255,.2)}
.view{animation:in .5s ease both}@keyframes in{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ch{cursor:pointer;text-align:center;padding:10px;transition:.2s}.ch:active{transform:scale(.96)}.ch.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.ch svg{width:100%;border-radius:14px}.ch b{display:block;margin-top:6px}
input{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.25);color:#fff;font-size:16px;margin-top:6px}
.st{background:rgba(0,0,0,.22);border-radius:14px;padding:11px}.st small{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.6px}.st div{font-size:19px;font-weight:800;margin-top:2px}
.bar{height:12px;background:rgba(255,255,255,.1);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;width:0;border-radius:9px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.wh{position:relative;width:280px;height:280px;margin:14px auto}
#wheel{width:100%;height:100%;border-radius:50%;border:6px solid var(--gold);position:relative;transition:transform 4.5s cubic-bezier(.12,.7,.1,1);background:conic-gradient(var(--red) 0 90deg,#1d3c7a 90deg 180deg,var(--char) 180deg 270deg,#8a6a26 270deg 360deg);box-shadow:0 0 40px rgba(212,20,47,.4)}
#wheel span{position:absolute;left:50%;top:50%;width:90px;margin-left:-45px;text-align:center;font-size:12px;font-weight:800;line-height:1.15}
.ptr{position:absolute;left:50%;top:-10px;margin-left:-12px;border:12px solid transparent;border-top:26px solid #fff;z-index:2}
.hub{position:absolute;inset:50% auto auto 50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:var(--navy);border:3px solid var(--gold);z-index:2}
#alert{position:fixed;inset:0;background:#120308;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:fl .5s infinite alternate;padding:20px}
@keyframes fl{from{background:#120308}to{background:#4a0714}}
#alert h1{font-size:30px;animation:gl .25s infinite alternate;color:#fff;text-shadow:0 0 20px var(--red)}@keyframes gl{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
.tri{font-size:70px;color:var(--red);animation:pu .6s infinite alternate}@keyframes pu{to{transform:scale(1.25)}}
.opt{cursor:pointer;transition:.15s}.opt:active{transform:scale(.97)}.opt b{font-size:17px}.opt .s{margin-top:3px}
.tm{font-size:38px;font-weight:900;text-align:center}.tm.low{color:var(--red);animation:pu .4s infinite alternate}
.ring{width:170px;height:170px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--gold) 0deg,rgba(255,255,255,.1) 0)}
.ring div{width:138px;height:138px;border-radius:50%;background:var(--navy);display:grid;place-items:center;font-size:44px;font-weight:900}
.bd{display:inline-block;padding:7px 12px;border-radius:99px;background:rgba(212,175,106,.15);border:1px solid var(--gold);color:var(--gold);font-size:12px;font-weight:700;margin:3px}
.pp{background:linear-gradient(135deg,#1a2f63,#0a1733 60%,#3a0a14);border:1.5px solid var(--gold);border-radius:20px;padding:16px;position:relative}
.qr{width:74px;height:74px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/14px 14px;border:5px solid #fff;border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vs .card{margin:0}.bad{border-color:var(--red)}.good{border-color:var(--ok)}
#foot{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:10px;color:var(--mut);background:rgba(10,23,51,.92);padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.card img,.card svg{animation:br 4s ease-in-out infinite}@keyframes br{50%{transform:scale(1.02)}}
.shake{animation:sh .6s 3}@keyframes sh{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(5px,-2px)}}
#vig{position:fixed;inset:0;pointer-events:none;z-index:11;box-shadow:inset 0 0 140px 40px rgba(212,20,47,.8);opacity:0;transition:opacity 1.2s}
.shield{position:relative}.shield:after{content:"";position:absolute;inset:-6px;border-radius:24px;border:2px solid var(--gold);box-shadow:0 0 30px var(--gold),inset 0 0 30px rgba(212,175,106,.4);animation:sp 1.8s ease-out both;pointer-events:none}@keyframes sp{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:scale(1)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:12}
.ukmp{background:#fff;border-radius:10px;padding:4px 8px;display:inline-flex;align-items:center;box-shadow:0 2px 10px #0006;vertical-align:middle}.ukmp img{width:auto;display:block}
.rv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px;opacity:0;transform:translateX(-16px);transition:.5s}.rv.on{opacity:1;transform:none}.rv.big b{font-size:26px;color:var(--red)}
.hid{display:none}.tr{font-size:12px;color:var(--mut);margin-top:5px}
.pc{font-size:13px;padding:7px 10px;border-radius:10px;margin-top:6px;line-height:1.4}.pc.ok{background:rgba(47,191,138,.12);border:1px solid rgba(47,191,138,.4)}.pc.no{background:rgba(212,20,47,.12);border:1px solid rgba(212,20,47,.4)}
.xp{background:rgba(212,175,106,.1);border-left:3px solid var(--gold);padding:8px 10px;border-radius:8px;margin-bottom:8px}.xp small{color:var(--gold);font-weight:800;letter-spacing:1px;font-size:10px}.xp p{color:#fff}
.bd{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}@keyframes pop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}.bd:nth-child(2){animation-delay:.15s}.bd:nth-child(3){animation-delay:.3s}.bd:nth-child(4){animation-delay:.45s}.bd:nth-child(5){animation-delay:.6s}.bd:nth-child(6){animation-delay:.75s}

body.lt{--gold:#9a7424;--mut:#55627f;--ok:#12906a;background:radial-gradient(100% 38% at 50% 0,#d9e4fa,transparent 70%),radial-gradient(60% 30% at 100% 100%,#fbe3e7,transparent 70%),#f3f6fc;color:#0a1733}

.lt .bar{background:#e2e8f3}

.lt .ib{background:#fff;color:#0a1733;border-color:#c9d3e6}

.lt .bd{background:#fbf4e3;border-color:#c9a24f;color:#7a5a16}
.lt .xp{background:#fbf6ea}
.lt .pc.ok{background:#e8f7f1;border-color:#9ad8c0}.lt .pc.no{background:#fdecee;border-color:#f0a9b3}
.lt .bad{border-color:#f0a9b3}.lt .good{border-color:#9ad8c0}
.lt .opt:active{background:#f6f8fd}
#wheel{color:#fff}#alert,#att{color:#fff;--gold:#d4af6a;--mut:#9aa7c4}
.lt .hero,.lt .pp{--gold:#d4af6a;--mut:#a9b5d0;color:#fff;border:0}
.lt .hero{background:linear-gradient(145deg,#0a1733,#1a2f63 62%,#7a1022);box-shadow:0 14px 34px rgba(10,23,51,.28)}
.lt .hero h1,.lt .hero h2,.lt .pp h2{color:#fff}.lt .hero h1 b{color:#ff4a63}
.lt .pp{box-shadow:0 14px 34px rgba(10,23,51,.28);border:1.5px solid var(--gold)}
.lt .pp .bd{background:rgba(212,175,106,.15);border-color:#d4af6a;color:#d4af6a}

.ic{width:24px;height:24px;display:block}

async function fbAll(){if(!FB_URL)return LB();try{const d=await(await fetch(FB_URL+'/leaderboard.json')).json();return Object.values(d||{}).sort((a,b)=>b.s-a.s)}catch(e){return LB()}}

function theme(){const b=document.body,l=b.classList.contains('lt');b.classList.toggle('lt',!l);b.classList.toggle('cy',l);try{localStorage.setItem('tks_th',l?'c':'l')}catch(e){}}

let mus=null,tense=false;function setTense(t){tense=t}
function toggleMute(b){mute=!mute;b.textContent=mute?'✕':'♪';if(mus)mus.m.gain.value=mute?0:.07;else if(!mute)music()}
function music(){if(mus||mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const m=AC.createGain();m.gain.value=.07;m.connect(AC.destination);const pads=[0,1,2].map(()=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';g.gain.value=.5;o.connect(g);g.connect(m);o.start();return o}),CH=[[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7],[164.8,196,246.9]];let i=0;const tone=(f,d,t,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0008,AC.currentTime+d);o.connect(g);g.connect(m);o.start();o.stop(AC.currentTime+d)};(function st(){const ch=CH[(i>>3)%4];if(i%8==0)pads.forEach((o,k)=>o.frequency.setTargetAtTime(ch[k]/2,AC.currentTime,.8));tone(ch[i%3]*(i%2?2:1),.6,'triangle',tense?.5:.35);if(tense&&i%2==0)tone(55,.25,'sine',1.2);if(i%8==0&&!tense)tone(ch[0]/4,2,'sine',.6);i++;setTimeout(st,tense?260:520)})();mus={m}}catch(e){}}
document.addEventListener('pointerdown',music,{once:true});

/* ===== v7: kad 3D, bandar isometrik, Mod Setahun, Tabung Tabarru' ===== */
(function(){
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  let tc=null;
  function clr(c){if(!c)return;c.classList.remove('tilt');c.style.transform='';}
  document.addEventListener('pointermove',e=>{
    if(reduce)return;const c=e.target.closest&&e.target.closest('.ch');
    if(tc&&tc!==c){clr(tc);tc=null}
    if(!c)return;tc=c;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
    c.classList.add('tilt');c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');
    c.style.transform='rotateX('+((.5-y)*16).toFixed(1)+'deg) rotateY('+((x-.5)*18).toFixed(1)+'deg) translateZ(8px)';
  },{passive:true});
  document.addEventListener('pointerleave',()=>{clr(tc);tc=null},true);
  document.addEventListener('pointerup',e=>{if(e.pointerType==='touch'){clr(tc);tc=null}},true);
})();

/* ---------- Bandar isometrik v8 (realistik) ---------- */
const KI=.866,hsh=n=>{n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const pts=a=>a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
function wg(S0,S1,h,cols,rows,seed,lit){
  let s='';const P=(u,z)=>[S0[0]+(S1[0]-S0[0])*u,S0[1]+(S1[1]-S0[1])*u-z];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const u0=(c+.22)/cols,u1=(c+.78)/cols,z0=h*(r+.25)/rows,z1=h*(r+.72)/rows,v=hsh(seed+r*13+c*7);
    const on=v>.38,col=on?(v>.8?'#9fe9ff':lit):'#0a1a44';
    s+=`<polygon${on&&v>.5&&(r+c)%3==0?' class="win"':''} points="${pts([P(u0,z0),P(u1,z0),P(u1,z1),P(u0,z1)])}" fill="${col}" opacity="${on?.95:.75}"/>`;
  }
  return s;
}
function bx(cx,cy,w,d,h,c,seed,wc,wr,lit){
  const A=[cx,cy],B=[cx+w*KI,cy+w*.5],D=[cx-d*KI,cy+d*.5],C=[B[0]-d*KI,B[1]+d*.5],U=p=>[p[0],p[1]-h];
  const L=[D,C,U(C),U(D)],R=[C,B,U(B),U(C)],T=[U(A),U(B),U(C),U(D)];
  let s=`<polygon points="${pts([[cx-d*KI-1,cy+d*.5+2],[C[0],C[1]+4],[B[0]+3,B[1]+2],[cx,cy-3]])}" fill="#000" opacity=".28"/>`;
  s+=`<polygon points="${pts(L)}" fill="${c[1]}"/><polygon points="${pts(L)}" fill="url(#fd)"/><polygon points="${pts(R)}" fill="${c[2]}"/><polygon points="${pts(R)}" fill="url(#fd)"/>`;
  if(wc){s+=wg(D,C,h,wc,wr,seed,lit)+wg(C,B,h,Math.max(2,Math.round(wc*d/w)),wr,seed+7,lit)}
  s+=`<polygon points="${pts(T)}" fill="${c[0]}"/><polygon points="${pts(T)}" fill="url(#tp)"/><polyline points="${pts([U(D),U(C),U(B)])}" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width=".7"/>`;
  return{s,A,B,C,D,h,w,d,top:[cx+(w-d)*.433,cy+(w+d)*.25-h]};

/* ---------- Mod Setahun ---------- */
let Y={};
function simYear(ch,i){
  const o=O[i],inc=ch.inc,live=Math.round(inc*.6),ri=Math.floor(Math.random()*4),r=R[ri],m1=3+Math.floor(Math.random()*7);
  let m2;do{m2=1+Math.floor(Math.random()*12)}while(m2==m1);
  const sk=SK[Math.floor(Math.random()*SK.length)],shock=Math.round(inc*r.m*ch.mod[ri]),pay=Math.round(o.f[ri]*shock),amt=Math.round(inc*sk.k);
  let a=ch.sav,b=ch.sav;const P=[a],N=[b],ev=[];
  for(let m=1;m<=12;m++){a+=inc-live-o.c;b+=inc-live;let e=null;
    if(m==m1){a+=pay-shock;b-=shock;e={k:'major'}}
    if(m==m2){a-=amt;b-=amt;e={k:'minor'}}
    P.push(a);N.push(b);ev[m]=e}
  return{o,i,inc,live,r,ri,m1,m2,shock,pay,sk,amt,P,N,ev,cost:o.c*12};
}
function ychart(y,upto){
  const all=y.P.concat(y.N,[0]),mn=Math.min(...all),mx=Math.max(...all),X=i=>20+i*(270/12),Yp=v=>112-(v-mn)/((mx-mn)||1)*100;
  const path=(a)=>a.slice(0,upto+1).map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Yp(v).toFixed(1)).join('');
  let s=`<line x1="20" x2="290" y1="${Yp(0)}" y2="${Yp(0)}" stroke="#9db4dd" stroke-dasharray="3 4" opacity=".7"/><text x="22" y="${Yp(0)-3}" fill="#9db4dd" font-size="8">RM 0</text>`;
  s+=`<path d="${path(y.N)}" fill="none" stroke="#ff3d57" stroke-width="2.2" stroke-linejoin="round"/><path d="${path(y.P)}" fill="none" stroke="#2ee59d" stroke-width="2.6" stroke-linejoin="round"/>`;
  for(let m=1;m<=upto;m++)if(y.ev[m])s+=`<circle cx="${X(m)}" cy="${Yp(y.P[m])}" r="4" fill="${y.ev[m].k=='major'?'#f5b82e':'#fff'}" stroke="#061233" stroke-width="1.5"/>`;
  for(let m=0;m<=12;m+=3)s+=`<text x="${X(m)}" y="126" fill="#9db4dd" font-size="8" text-anchor="middle">${m}</text>`;

}

  const o=O[PL.p],rate=PRATE[PL.r],N=100,contrib=o.c*12,pool=Math.round(N*contrib*PSHARE),cl=Math.round(Math.max(...o.f)*PSHOCK),k=Math.round(N*rate),claims=k*cl;

/* ---------- Borang maklumat diri ---------- */
const PQ=[
{k:'age',t:'Umur anda',o:['18–24','25–34','35–44','45–54','55+'],v:[21,30,40,50,62]},
{k:'job',t:'Status pekerjaan',o:['Pelajar / graduan baru','Bergaji tetap','Kerja sendiri / gig / perniagaan','Pesara / hampir bersara'],v:['student','salary','self','retired']},
{k:'inc',t:'Pendapatan bulanan',o:['Bawah RM3,000','RM3,000–5,000','RM5,000–8,000','Atas RM8,000'],v:[2500,4000,6500,9500]},
{k:'dep',t:'Bilangan tanggungan',o:['Tiada','1–2 orang','3 orang atau lebih'],v:[0,1.5,3.5]},
{k:'sav',t:'Simpanan semasa',o:['Bawah RM2,000','RM2,000–10,000','RM10,000–40,000','Atas RM40,000'],v:[1000,5000,22000,60000]},
{k:'con',t:'Risiko yang paling anda bimbangi',o:['Kemalangan','Hilang upaya / sakit kritikal','Kecemasan keluarga','Kematian pencari nafkah'],v:[0,1,2,3]}];
const JR={student:{self:.45,salary:.5,retired:.05},self:{salary:.5,retired:.25,student:.45},salary:{retired:.35,student:.5,self:.5},retired:{student:.05,self:.25,salary:.35}};
const lsim=(a,b,r)=>1-Math.min(1,Math.abs(Math.log((a+300)/(b+300)))/Math.log(r));
function matchScore(c,p){
  const age=1-Math.min(1,Math.abs(p.age-c.age)/30),job=p.job==c.job?1:(JR[p.job][c.job]||.2),inc=lsim(p.inc,c.inc,4),dep=1-Math.min(1,Math.abs(p.dep-c.dep)/3.5),sav=lsim(p.sav,c.sav,30),con=c.mod[p.con]>1?1:.35;
  return age*.15+job*.25+inc*.25+dep*.1+sav*.1+con*.15;
}
function recommend(){
  const p=S.prof;S.rec=C.map((c,i)=>({i,pct:Math.round(matchScore(c,p)*100)})).sort((a,b)=>b.pct-a.pct);
}
SC.profile=function(){
  const P=S.pa=S.pa||{};
  V.innerHTML=`<h2 style="text-align:center">Kenali Diri Anda</h2><p style="text-align:center;margin:6px 0 12px">Hai ${esc(S.name)}! Jawab 6 soalan ringkas dan sistem akan mencadangkan <b>Character</b> yang paling sepadan dengan profil anda. Jawapan hanya digunakan dalam game ini dan tidak disimpan.</p>${PQ.map((q,qi)=>`<div class="card"><h3>${qi+1}. ${q.t}</h3><div class="chp">${q.o.map((o,oi)=>`<button class="${P[q.k]===oi?'on':''}" onclick="pa('${q.k}',${oi},this)">${o}</button>`).join('')}</div></div>`).join('')}<button class="btn" id="prb" onclick="doRec()">CADANGKAN CHARACTER →</button><button class="btn g" onclick="S.rec=null;go('pick')">LANGKAU (PILIH SENDIRI)</button>`;
  prUp();
};
function pa(k,oi,el){S.pa[k]=oi;[...el.parentNode.children].forEach(b=>b.classList.toggle('on',b===el));prUp()}
function prUp(){const b=$('#prb');if(!b)return;const ok=PQ.every(q=>S.pa[q.k]!=null);b.disabled=!ok;b.style.opacity=ok?1:.45;b.textContent=ok?'CADANGKAN CHARACTER →':'LENGKAPKAN SEMUA SOALAN ('+PQ.filter(q=>S.pa[q.k]!=null).length+'/6)'}
function doRec(){S.prof={};PQ.forEach(q=>S.prof[q.k]=q.v[S.pa[q.k]]);recommend();go('pick')}
function setMode(m){S.mode=m;S.name=($('#nm').value.trim()||'Pemain');S.pa=S.pa||{};go('profile')}

/* ---------- Skrin pilih Character (dikemas) ---------- */
SC.pick=function(){
  const rec=S.rec,order=rec?rec.map(r=>r.i):C.map((_,i)=>i),pm={};if(rec)rec.forEach(r=>pm[r.i]=r.pct);
  const top=rec&&C[order[0]];
  V.innerHTML=`<h2 style="text-align:center">Pilih Character Anda</h2><p style="margin:6px 4px 12px;text-align:center">${rec?`Berdasarkan jawapan anda, <b style="color:var(--gold)">${top.n}</b> paling sepadan. Anda masih boleh memilih mana-mana character.`:'Setiap character mempunyai profil kewangan yang berbeza. Pilih satu untuk bermula.'}</p><div class="cg">${order.map((i,k)=>{const c=C[i],lv=riskLv(c);return `<div class="card ch ${rec&&k==0?'rec':''}" onclick="pickGo(this,()=>{S.ch=Object.assign({},C[${i}]);S.round=1;S.scores=[];go('dash')})">${rec?`<span class="mt">${k==0?'DISYORKAN · ':''}${pm[i]}% sepadan</span>`:''}${vface(c)}<b>${c.n.toUpperCase()}</b><div class="cs"><span>Pendapatan</span><b>${fmt(c.inc)}</b></div><div class="cs"><span>Simpanan</span><b>${fmt(c.sav)}</b></div><div class="cs"><span>Tanggungan</span><b>${c.dep} orang</b></div><div class="rc" style="color:${lv[1]};border-color:${lv[1]}">Risiko: ${lv[0]}</div></div>`}).join('')}</div><div class="card" style="margin-top:12px"><p style="font-size:12px"><b>Risiko</b> = tahap pendedahan kepada kejadian yang menjejaskan pendapatan. Potret ialah ilustrasi / dijana AI; character adalah fiksyen.</p></div><button class="btn g" onclick="go('profile')">↻ ISI SEMULA MAKLUMAT DIRI</button>`;
};

/* ===== v11: Risk Profile terperinci — tanggungan, pengiraan exposure & laras profil ===== */
const FAM={
amir:{sp:1,kid:1,ot:0,haz:90,hz:'Rider: banyak masa di jalan raya, risiko kemalangan tinggi',fn:'Isteri (suri rumah) dan seorang bayi 8 bulan'},
siti:{sp:0,kid:2,ot:1,haz:35,hz:'Kerja pejabat: pendedahan fizikal rendah',fn:'Dua anak sekolah (9 & 12 tahun) dan seorang ibu yang uzur'},
daniel:{sp:1,kid:1,ot:0,haz:25,hz:'Kerja pejabat: pendedahan fizikal rendah',fn:'Isteri dan seorang anak berumur 5 tahun'},
rahman:{sp:1,kid:0,ot:0,haz:30,hz:'Kerja ringan menjelang persaraan',fn:'Isteri yang tidak bekerja'},
aina:{sp:0,kid:0,ot:0,haz:30,hz:'Kerja permulaan: pendedahan fizikal rendah',fn:'Tiada tanggungan'},
hafiz:{sp:1,kid:2,ot:0,haz:60,hz:'Perniagaan kecil: kerja lasak dan bergantung pada tenaga sendiri',fn:'Isteri dan dua anak (7 & 10 tahun)'},
nurul:{sp:0,kid:1,ot:1,haz:70,hz:'Jururawat: syif panjang, risiko cedera dan jangkitan',fn:'Seorang anak (4 tahun) dan seorang ibu yang tinggal bersama'},
osman:{sp:1,kid:0,ot:0,haz:25,hz:'Sudah bersara: pendedahan kerja rendah',fn:'Isteri yang bergantung pada pencen'}};
const EXJ={salary:[25,'Gaji tetap: pendapatan lebih stabil'],retired:[55,'Pencen / persaraan: tetap tetapi terhad dan sukar ditambah'],student:[60,'Baru mula bekerja: pendapatan masih rendah dan belum mantap'],self:[80,'Kerja sendiri: pendapatan tidak tetap; berhenti kerja bermakna tiada pendapatan']};
const exAge=a=>a<=25?[20,'Muda: risiko kesihatan rendah']:a<=35?[30,'Awal dewasa: risiko kesihatan agak rendah']:a<=45?[45,'Pertengahan umur: risiko kesihatan mula meningkat']:a<=55?[65,'Umur 46–55: risiko sakit kritikal dan hilang upaya meningkat']:[85,'Umur 56 ke atas: risiko kesihatan dan hilang upaya tinggi'];
const exLv=t=>t>=60?['Tinggi','var(--red)']:t>=40?['Sederhana','var(--gold)']:['Rendah','var(--ok)'];
function expo(c){
  const sp=c.sp||0,kd=c.kid||0,ot=c.ot||0,u=sp+kd+ot,mo=c.sav/Math.max(1,c.inc),j=EXJ[c.job]||[50,'Sumber pendapatan'],a=exAge(c.age);
  const who=[sp?'pasangan':'',kd?kd+' anak':'',ot?ot+' ahli keluarga lain':''].filter(Boolean).join(', ');
  const parts=[
    ['Tanggungan',.28,100*(1-Math.exp(-u/2)),u?u+' orang bergantung pada pendapatan anda ('+who+'). Makin ramai bergantung, makin besar kos jika pendapatan terhenti (kesannya berkurang sedikit demi sedikit selepas ramai tanggungan).':'Tiada tanggungan, jadi kos jika pendapatan terhenti lebih kecil.'],
    ['Penampan kecemasan',.24,100-Math.min(100,mo/6*100),'Simpanan anda cukup untuk '+mo.toFixed(1)+' bulan pendapatan (sasaran selamat: 6 bulan).'],
    ['Kestabilan pendapatan',.18,j[0],j[1]+'.'],
    ['Umur',.15,a[0],a[1]+'.'],
    ['Pendedahan kerja',.15,c.haz==null?40:c.haz,(c.hz||'Pendedahan kerja sederhana')+'.']
  ].map(x=>({l:x[0],w:x[1],s:x[2],p:x[2]*x[1],r:x[3]}));
  return {t:Math.round(parts.reduce((s,p)=>s+p.p,0)),parts,u,mo};
}
C.forEach(c=>{Object.assign(c,FAM[c.id]);c.mod0=c.mod.slice();c.dep=c.sp+c.kid+c.ot;c.exp=expo(c).t;c.fh=Math.round(25+(100-c.exp)*.75)});

function rpEnsure(c){
  if(c.base)return;
  c.base={inc:c.inc,sav:c.sav,sp:c.sp,kid:c.kid,ot:c.ot};
  const si=100,ss=c.sav<5000?100:500;
  c.rng={inc:[Math.round(c.inc*.7/si)*si,Math.round(c.inc*1.3/si)*si,si],sav:[Math.floor(c.sav*.5/ss)*ss,Math.ceil(c.sav*1.5/ss)*ss,ss]};
}
function rpApply(c){

 intro:'Selamat datang ke Takaful Survival. Saya akan terangkan cara bermain dalam enam langkah.',
 s:[
 'Langkah satu. Pilih watak. Taip nama anda, kemudian jawab enam soalan ringkas supaya sistem cadangkan watak yang sesuai, atau terus pilih satu daripada lapan watak. Setiap watak ada pendapatan, simpanan, tanggungan dan risiko yang berbeza.',
 'Langkah dua. Putar roda risiko. Ketik butang spin. Roda akan memilih satu risiko: kemalangan, hilang upaya, kecemasan keluarga, atau kematian pencari nafkah. Jumlah kejutan dikira daripada pendapatan dan kerentanan watak anda.',
 'Langkah tiga. Lihat jurang dan kad dilema. Jurang ialah jumlah kejutan tolak simpanan yang sanggup anda guna. Laraskan peratus simpanan dan lihat jurang berubah. Kemudian pada kad dilema, simpan lebihan bulanan sebagai tunai, atau rancang lebih awal untuk mendapat tiga mata.',
 'Langkah empat. Pilih perlindungan. Anda ada enam puluh saat untuk memilih satu daripada empat pelan. Padankan pelan dengan risiko, pastikan sumbangan mampu dibayar, dan jangan lambat kerana baki masa memberi mata. Sumbangan sehingga tiga peratus pendapatan mendapat skor kemampuan penuh.',
 'Langkah lima. Plot twist. Selepas kes pertama, kejutan kedua yang bersambung akan datang. Baki tunai, atau hutang, dari kes pertama dibawa ke kes kedua, jadi keputusan pertama anda menjejaskan yang kedua. Kemudian anda jawab soalan bonus untuk sembilan mata tambahan.',
 'Langkah enam. Skor dan belajar. Anda akan dapat skor penuh seratus mata, lencana, dan Player Passport, serta tempat di papan markah. Skrin Learning menerangkan konsep takaful yang baru anda alami, dan nasihat akhir menjawab sama ada anda perlu takaful. Skor lapan puluh ke atas ialah Financial Survivor.'
 ],
 outro:'Untuk skor, setiap kes dibahagi kepada padanan perlindungan tiga puluh lima mata, kemampuan sumbangan dua puluh lima, kelangsungan tunai tiga puluh, dan kelajuan membuat keputusan sepuluh. Itu sahaja. Selamat mencuba!'
};
function showHow(){
 if(document.getElementById('hw'))return;
 const N=HW.length,STEP=360/N,R=Math.round(82/Math.tan(Math.PI/N))+10;
 let a=0,auto=null,auto_off=false;
 const d=document.createElement('div');d.className='ov';d.id='hw';
 d.innerHTML='<div class="card"><h3>Cara Main</h3><h2>Takaful Survival dalam '+N+' langkah</h2>'
  +'<div class="hw-stage" id="hw-st"><div class="hw-tilt"><div class="hw-ring" id="hw-rg">'
  +HW.map((s,i)=>'<div class="hw-p" style="transform:rotateY('+(i*STEP)+'deg) translateZ('+R+'px)"><span class="hw-n">'+(i+1)+'/'+N+'</span><span class="hw-ic">'+((typeof I!=='undefined'&&I[s.ic])||'')+'</span><b>'+s.t+'</b></div>').join('')
  +'</div></div><div class="hw-floor"></div></div>'
  +'<div class="hw-ctl"><button class="ib" id="hw-pv" aria-label="Sebelum">‹</button><span class="hw-cnt" id="hw-ct"></span><button class="ib" id="hw-nx" aria-label="Seterusnya">›</button></div>'
  +'<div class="hw-vo" id="hw-vw"><button class="btn gold" id="hw-vo">🔊 DENGAR PENERANGAN</button></div><div class="hw-vn" id="hw-vn"></div>'
  +'<div class="hw-trk" id="hw-tk"><i id="hw-bar"></i>'+HW.map((s,i)=>'<button class="hw-nd" data-i="'+i+'" aria-label="Langkah '+(i+1)+'"></button>').join('')+'</div>'
  +'<div class="hw-info" id="hw-if"></div>'
  +'<div class="card hw-sc" style="margin:12px 0 0;padding:12px"><h3>Cara skor (setiap kes, 100 mata)</h3>'
  +'<div class="row"><span>Padanan perlindungan dengan risiko</span><b>35</b></div><div class="row"><span>Kemampuan sumbangan</span><b>25</b></div><div class="row"><span>Kelangsungan tunai selepas kejutan</span><b>30</b></div><div class="row" style="border:0"><span>Kelajuan membuat keputusan</span><b>10</b></div></div>'
  +'<div id="hw-go"></div><button class="btn g" id="hw-x">TUTUP</button><p style="font-size:12px;margin-top:8px">Simulasi pendidikan sahaja. Semua nilai RM adalah ilustrasi.</p></div>';
 document.body.appendChild(d);
 const $h=s=>d.querySelector(s),rg=$h('#hw-rg'),ps=[...d.querySelectorAll('.hw-p')],nds=[...d.querySelectorAll('.hw-nd')];
 if(typeof cur!=='undefined'&&cur==='start'){$h('#hw-go').innerHTML='<button class="btn gold" id="hw-pl">▶ MAIN SEKARANG</button>';$h('#hw-pl').onclick=()=>{close();go('mode')}}
 function idx(){return((a%N)+N)%N}
 function render(){
  const i=idx();rg.style.transform='rotateY('+(-a*STEP)+'deg)';
  ps.forEach((p,k)=>p.classList.toggle('on',k===i));
  nds.forEach((n,k)=>{n.classList.toggle('on',k===i);n.classList.toggle('dn',k<i)});
  $h('#hw-ct').textContent=(i+1)+' / '+N;
  const w=nds[N-1].offsetLeft-nds[0].offsetLeft;$h('#hw-bar').style.width=(w*i/(N-1))+'px';
  const s=HW[i];$h('#hw-if').innerHTML='<div class="card" style="margin:0"><h3>Langkah '+(i+1)+'</h3><h2>'+s.t+'</h2><p>'+s.d+'</p><div class="hw-pt">'+s.pt+'</div></div>';
 }
 function stop(){if(auto){clearInterval(auto);auto=null}}
 function rot(k){a+=k;render()}
 function move(k){stop();rot(k);if(typeof snd==='function'&&!on)snd(520,.06,'triangle',.05);if(on)playFrom(1+idx())}
 function close(){stop();stopVoice();document.removeEventListener('keydown',key);d.remove()}
 /* --- suara naratif (Web Speech API) --- */
 const SS=window.speechSynthesis,vb=$h('#hw-vo'),vn=$h('#hw-vn');
 const L=[{s:0,t:HWV.intro}].concat(HWV.s.map((t,i)=>({s:i,t:t})),[{s:N-1,t:HWV.outro}]);
 let on=false,tok=0,voice=null;
 function pick(){const vs=SS.getVoices();voice=vs.find(v=>/^ms/i.test(v.lang))||vs.find(v=>/^id/i.test(v.lang))||null;
  vn.textContent=voice?'Suara: '+voice.name+' ('+voice.lang+')':(vs.length?'Suara Bahasa Melayu tiada pada peranti ini; guna suara lalai.':'')}
 function setUi(){vb.textContent=on?'■ HENTI SUARA':'🔊 DENGAR PENERANGAN';$h('#hw-if').classList.toggle('sp',on)}
 function chunks(t){return t.match(/[^.:!?]+[.:!?]*/g).map(x=>x.trim()).filter(Boolean)}
 function sayItem(k,my){
  if(my!==tok||!on)return;
  if(k>=L.length){on=false;setUi();return}
  const it=L[k];let df=it.s-idx();if(df>N/2)df-=N;if(df<-N/2)df+=N;if(df)rot(df);
  const cs=chunks(it.t);
  (function next(j){
   if(my!==tok||!on)return;
   if(j>=cs.length)return sayItem(k+1,my);
   const u=new SpeechSynthesisUtterance(cs[j]);u.lang=voice?voice.lang:'ms-MY';if(voice)u.voice=voice;u.rate=.95;u.pitch=1;
   u.onend=()=>next(j+1);
   u.onerror=e=>{if(my!==tok)return;if(e&&(e.error==='canceled'||e.error==='interrupted'))return;on=false;setUi()};
   SS.speak(u);
  })(0);
 }
 function playFrom(k){tok++;const my=tok;SS.cancel();on=true;stop();setUi();setTimeout(()=>sayItem(k,my),80)}
 function stopVoice(){tok++;on=false;try{SS&&SS.cancel()}catch(e){}if(d.isConnected)setUi()}
 if(!SS||typeof SpeechSynthesisUtterance==='undefined'){$h('#hw-vw').style.display='none';vn.textContent='Peranti ini tidak menyokong suara penerangan.'}
 else{try{const u0=new SpeechSynthesisUtterance(' ');u0.volume=0;SS.speak(u0)}catch(e){}pick();if(SS.addEventListener)SS.addEventListener('voiceschanged',pick);
  vb.onclick=()=>{if(on)stopVoice();else playFrom(idx()===0?0:1+idx())};
  if(!(typeof mute!=='undefined'&&mute))setTimeout(()=>{if(d.isConnected&&!on&&!auto_off)playFrom(0)},450)}
 function key(e){if(e.key==='Escape')close();else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1)}
 $h('#hw-nx').onclick=()=>move(1);$h('#hw-pv').onclick=()=>move(-1);$h('#hw-x').onclick=close;
 nds.forEach(n=>n.onclick=()=>{const t=+n.dataset.i;let df=t-idx();if(df>N/2)df-=N;if(df<-N/2)df+=N;move(df)});
 let sx=null;const st=$h('#hw-st');
 st.addEventListener('pointerdown',e=>{sx=e.clientX});
 st.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx;sx=null;if(Math.abs(dx)>40)move(dx<0?1:-1)});
 document.addEventListener('keydown',key);
 render();
 if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches))auto=setInterval(()=>{if(!document.body.contains(d))return stop();a++;render()},4200);
}
(function(){const m=document.getElementById('mt');if(!m||document.getElementById('hw-b'))return;const b=document.createElement('button');b.className='ib';b.id='hw-b';b.title='Cara main';b.setAttribute('aria-label','Cara main');b.textContent='?';b.onclick=showHow;(document.getElementById('fx')||m).parentNode.insertBefore(b,document.getElementById('fx')||m)})();
</script>
</body></html>
